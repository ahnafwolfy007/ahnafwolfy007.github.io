<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Books | Ahnaf Atique</title>
  <meta name="description" content="Free downloadable course books and teaching materials by Ahnaf Atique — C, OOP Java, DSA, Databases, Computer Networks, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0f1a;
      --surface: #141624;
      --card:    #1b1e2e;
      --border:  #ffffff12;
      --accent:  #7c6af7;
      --accent2: #56cfe1;
      --text:    #e8eaf0;
      --muted:   #8b90a8;
      --radius:  16px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(120px); opacity: .16;
      pointer-events: none; z-index: 0;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb-1 { width:650px; height:650px; background:var(--accent);  top:-220px; left:-220px; }
    .orb-2 { width:550px; height:550px; background:var(--accent2); bottom:-180px; right:-180px; animation-delay:-7s; }
    @keyframes drift { from{transform:translate(0,0)} to{transform:translate(50px,35px)} }

    .wrapper {
      position: relative; z-index: 1;
      max-width: 1160px; margin: 0 auto;
      padding: 0 24px 100px;
    }

    /* ── Header ── */
    header { padding: 56px 0 44px; text-align: center; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none;
      font-size: .84rem; letter-spacing: .04em;
      margin-bottom: 32px; transition: color .2s;
    }
    .back-link:hover { color: var(--accent2); }
    .back-link svg { width:15px; height:15px; }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1.15; margin-bottom: 12px;
    }
    .subtitle {
      color: var(--muted); font-size: 1rem;
      max-width: 500px; margin: 0 auto; line-height: 1.65;
    }

    .stats {
      display: flex; justify-content: center;
      gap: 48px; margin: 34px 0 0; flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.9rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label { font-size:.75rem; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; margin-top:3px; }

    .divider { height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent); margin:48px 0; }

    .search-wrap { max-width:420px; margin:0 auto 36px; position:relative; }
    .search-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); }
    #search {
      width:100%; padding:11px 16px 11px 40px;
      border-radius:10px; border:1px solid var(--border);
      background:var(--surface); color:var(--text);
      font-size:.9rem; font-family:'Inter',sans-serif;
      outline:none; transition:border-color .2s;
    }
    #search:focus { border-color:var(--accent); }
    #search::placeholder { color:var(--muted); }

    .section-label {
      display:flex; align-items:center; gap:10px;
      font-size:.75rem; letter-spacing:.1em; text-transform:uppercase;
      color:var(--muted); margin-bottom:24px;
    }
    .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px;
      display: flex; flex-direction: column; gap: 14px;
      position: relative; overflow: hidden;
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    .card::before {
      content:''; position:absolute; inset:0 0 auto 0; height:3px;
      background:var(--card-streak, linear-gradient(90deg,var(--accent),var(--accent2)));
      opacity:0; transition:opacity .25s;
    }
    .card:hover { transform:translateY(-5px); border-color:rgba(124,106,247,.5); box-shadow:0 20px 60px #7c6af71a; }
    .card:hover::before { opacity:1; }
    .card.hidden { display:none; }

    .card-top { display:flex; justify-content:space-between; align-items:flex-start; }

    .card-icon { width:46px; height:46px; border-radius:12px; display:grid; place-items:center; font-size:1.45rem; }

    .tag {
      display:inline-block; font-size:.68rem; font-weight:700;
      letter-spacing:.08em; text-transform:uppercase;
      padding:3px 10px; border-radius:999px; color:#fff;
    }

    .card-title { font-family:'Space Grotesk',sans-serif; font-size:1.05rem; font-weight:600; line-height:1.4; }

    .card-meta { display:flex; gap:8px; font-size:.74rem; color:var(--muted); flex-wrap:wrap; }
    .meta-pill {
      display:flex; align-items:center; gap:4px;
      background:var(--surface); border:1px solid var(--border);
      padding:3px 9px; border-radius:999px;
    }

    .card-footer { margin-top:auto; }

    .download-btn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      width:100%; padding:11px 18px; border-radius:10px;
      color:#fff; font-weight:600; font-size:.88rem;
      text-decoration:none; transition:opacity .2s, transform .15s;
    }
    .download-btn:hover { opacity:.85; transform:scale(.98); }
    .download-btn svg { width:17px; height:17px; flex-shrink:0; }

    /* ── Loading / Error ── */
    .state-msg {
      text-align: center; padding: 60px 20px; color: var(--muted);
      font-size: .95rem; grid-column: 1 / -1;
    }
    .state-msg .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align:center; padding:28px 0 0; color:var(--muted);
      font-size:.82rem; border-top:1px solid var(--border);
    }
    footer a { color:var(--accent2); text-decoration:none; }
    footer a:hover { text-decoration:underline; }

    @media (max-width:500px) { .stats{gap:24px;} .card{padding:20px;} }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">

  <header>
    
    <h1>📚 Course Books</h1>
    <p class="subtitle">Free teaching materials I've authored for my students — download any book instantly as a PDF.</p>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-books">—</div><div class="stat-label">Books</div></div>
      <div class="stat"><div class="stat-num" id="stat-courses">—</div><div class="stat-label">Courses</div></div>
      <div class="stat"><div class="stat-num">Free</div><div class="stat-label">Always</div></div>
    </div>
  </header>

  <div class="divider"></div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="search" placeholder="Search by course or topic…" autocomplete="off" />
  </div>

  <div class="section-label">All Books</div>

  <div class="grid" id="grid">
    <div class="state-msg">
      <div class="spinner"></div>
      Loading books from GitHub…
    </div>
  </div>

  <div class="divider"></div>

  <footer>
     &middot; Source on
      <a href="https://github.com/ahnafwolfy007/CSE-Teaching-Materials" target="_blank" rel="noopener">GitHub ↗</a>
    </p>
  </footer>

</div>

<script>
// ─── Course metadata lookup ───────────────────────────────────────────────────
// Keys are matched against the folder name (case-insensitive partial match).
// Add new entries here for custom colours / icons — otherwise a default is used.
const COURSE_META = [
  { match: /structured.?program|^spl/i,  label:'Intro',  color:'#6366f1', icon:'💻', tag:'C Language'   },
  { match: /cse201|oop.*java|java.*oop/i, label:'CSE201', color:'#22c55e', icon:'☕', tag:'Java / OOP'   },
  { match: /cse209|computer.?arch/i,      label:'CSE209', color:'#0ea5e9', icon:'🖥️', tag:'Hardware'     },
  { match: /cse211|theory.*comput/i,      label:'CSE211', color:'#a855f7', icon:'🔬', tag:'Automata'     },
  { match: /cse215|database|dbms/i,       label:'CSE215', color:'#ef4444', icon:'🗄️', tag:'SQL / DBMS'  },
  { match: /cse301|dsa.?i[^i]|dsa.?1/i,  label:'CSE301', color:'#f59e0b', icon:'🧮', tag:'C++ / DSA'   },
  { match: /cse302|dsa.?ii|dsa.?2/i,     label:'CSE302', color:'#7c6af7', icon:'⚡', tag:'C++ / DSA'   },
  { match: /cse321|computer.?net/i,       label:'CSE321', color:'#14b8a6', icon:'🌐', tag:'Networking'   },
  { match: /cse401|operating.*sys|os\b/i, label:'CSE401', color:'#f97316', icon:'⚙️', tag:'OS'          },
  { match: /cse411|compiler/i,            label:'CSE411', color:'#ec4899', icon:'🔧', tag:'Compilers'    },
  { match: /cse421|artificial|ai\b/i,     label:'CSE421', color:'#8b5cf6', icon:'🤖', tag:'AI / ML'     },
  { match: /cse431|software.*eng|swe/i,   label:'CSE431', color:'#10b981', icon:'🏗️', tag:'SWE'        },
];

const PALETTE = [
  '#6366f1','#22c55e','#0ea5e9','#a855f7',
  '#ef4444','#f59e0b','#7c6af7','#14b8a6',
  '#f97316','#ec4899','#10b981','#8b5cf6',
];
const DEFAULT_ICONS = ['📖','📘','📗','📕','📙','📔'];

function getMeta(folderName, index) {
  for (const m of COURSE_META) {
    if (m.match.test(folderName)) return m;
  }
  // auto-generate from folder name
  const color = PALETTE[index % PALETTE.length];
  const icon  = DEFAULT_ICONS[index % DEFAULT_ICONS.length];
  // try to extract a course code like CSE123
  const codeMatch = folderName.match(/[A-Z]+\d{3}/i);
  const label = codeMatch ? codeMatch[0].toUpperCase() : 'Book';
  return { label, color, icon, tag: 'PDF' };
}

function humanSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function slugTitle(path) {
  // Convert path like "CSE301-DSA-I/DSA-1_cpp.pdf" → "Data Structures & Algorithms I"
  const folder = path.split('/')[0];
  // Strip leading course code
  return folder
    .replace(/^[A-Z]+\d{3}-?/i, '')   // remove e.g. CSE301-
    .replace(/[-_]/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase())
    .trim() || folder;
}

function downloadIcon() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
  </svg>`;
}

function buildCard(pdf, index) {
  const folder  = pdf.path.split('/')[0];
  const file    = pdf.path.split('/').pop();
  const meta    = getMeta(folder, index);
  const title   = slugTitle(pdf.path);
  const rawUrl  = `https://raw.githubusercontent.com/ahnafwolfy007/CSE-Teaching-Materials/main/${pdf.path.split('/').map(encodeURIComponent).join('/')}`;
  const size    = humanSize(pdf.size);
  const search  = (folder + ' ' + file + ' ' + title + ' ' + meta.tag + ' ' + meta.label).toLowerCase();

  return `
  <div class="card" data-search="${search}">
    <div class="card-top">
      <div class="card-icon" style="background:${meta.color}18;">${meta.icon}</div>
      <span class="tag" style="background:${meta.color};">${meta.label}</span>
    </div>
    <div class="card-title">${title}</div>
    <div class="card-meta">
      <span class="meta-pill">📄 PDF</span>
      <span class="meta-pill">~${size}</span>
      <span class="meta-pill">${meta.tag}</span>
    </div>
    <div class="card-footer">
      <a class="download-btn"
         style="background:linear-gradient(135deg,${meta.color},${meta.color}bb);"
         href="${rawUrl}"
         download="${file}">
        ${downloadIcon()}
        Download PDF
      </a>
    </div>
  </div>`;
}

// ─── Main: fetch & render ─────────────────────────────────────────────────────
async function loadBooks() {
  const grid = document.getElementById('grid');
  try {
    const res  = await fetch('https://api.github.com/repos/ahnafwolfy007/CSE-Teaching-Materials/git/trees/main?recursive=1');
    if (!res.ok) throw new Error('GitHub API error ' + res.status);
    const data = await res.json();

    // Keep only .pdf files (not in sub-sub folders — depth 2 means folder/file.pdf)
    const pdfs = data.tree.filter(n => n.type === 'blob' && n.path.toLowerCase().endsWith('.pdf'));

    if (!pdfs.length) {
      grid.innerHTML = '<div class="state-msg">No PDF books found in the repository yet.</div>';
      return;
    }

    // Update stats
    document.getElementById('stat-books').textContent   = pdfs.length;
    document.getElementById('stat-courses').textContent = pdfs.length;

    // Render cards
    grid.innerHTML = pdfs.map((pdf, i) => buildCard(pdf, i)).join('');

    // Wire up search
    const input = document.getElementById('search');
    const cards = grid.querySelectorAll('.card');
    input.addEventListener('input', () => {
      const q = input.value.toLowerCase().trim();
      cards.forEach(c => {
        const hit = !q || c.dataset.search.includes(q);
        c.classList.toggle('hidden', !hit);
      });
    });

  } catch (err) {
    grid.innerHTML = `<div class="state-msg">
      ⚠️ Could not load books.<br>
      <small style="margin-top:8px;display:block;">${err.message}</small><br>
      <a href="https://github.com/ahnafwolfy007/CSE-Teaching-Materials" target="_blank" style="color:var(--accent2);">Browse on GitHub ↗</a>
    </div>`;
  }
}

loadBooks();
</script>

</body>
</html>
